name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_python:
        description: "Publish the Python package if PYPI_TOKEN is configured"
        required: false
        default: true
        type: boolean
      publish_container:
        description: "Publish the container image if registry credentials are configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run test suite
        run: pytest -q

      - name: Run Ruff
        run: ruff check src tests

      - name: Run mypy
        run: mypy src --ignore-missing-imports

      - name: Build distribution
        run: python -m build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*

  publish-python:
    needs: quality-gate
    if: github.event_name == 'push' || inputs.publish_python
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Skip PyPI publish when token is missing
        if: env.PYPI_TOKEN == ''
        run: echo "PYPI_TOKEN is not configured. Skipping PyPI publish."

  publish-container:
    needs: quality-gate
    if: github.event_name == 'push' || inputs.publish_container
    runs-on: ubuntu-latest
    env:
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      CONTAINER_IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME || github.repository }}
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.CONTAINER_REGISTRY_USERNAME != '' || env.CONTAINER_REGISTRY_PASSWORD != ''
        uses: docker/setup-buildx-action@v3

      - name: Detect Docker availability
        id: docker
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Docker metadata
        if: steps.docker.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to container registry
        if: steps.docker.outputs.available == 'true' && env.CONTAINER_REGISTRY_USERNAME != '' && env.CONTAINER_REGISTRY_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and optionally push Docker image
        if: steps.docker.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/docker/Dockerfile
          push: ${{ env.CONTAINER_REGISTRY_USERNAME != '' && env.CONTAINER_REGISTRY_PASSWORD != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Skip container publish when credentials are missing
        if: steps.docker.outputs.available == 'true' && (env.CONTAINER_REGISTRY_USERNAME == '' || env.CONTAINER_REGISTRY_PASSWORD == '')
        run: echo "Container registry credentials are not configured. Image was built but not pushed."

      - name: Skip container publish when Docker is unavailable
        if: steps.docker.outputs.available != 'true'
        run: echo "Docker is not installed on this self-hosted runner. Skipping container publish."
