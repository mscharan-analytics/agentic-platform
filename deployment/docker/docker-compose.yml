version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent-platform:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LOG_LEVEL=INFO
    volumes:
      - ./../../src:/app/src
      - ./../../tests:/app/tests
    command: ["python", "-m", "agent_platform.main", "api", "--host", "0.0.0.0", "--port", "8000"]

  web-ui:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.ui
    ports:
      - "3000:3000"
    depends_on:
      - agent-platform
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./../../src/web-ui:/app

volumes:
  ollama_data:
